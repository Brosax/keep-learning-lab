<div id="course-app"></div><noscript><main><h1>机器学习：从统计原理到可靠实践</h1><p>22 讲中文导学，按 CS229 官方讲义笔记的小节顺序整理监督学习、核方法与 SVM、深度学习、学习理论、无监督学习、强化学习，以及应用建议与隐私。每段注明讲义文件和 PDF 页码，以讲义里的推导和手算例题为主；交互图示和代码演示只在需要“看着它变”或“跑一遍”的地方提供（梯度下降、间隔、EM、PCA；核技巧、感知机、k-means、价值迭代）。</p><p>交互学习需要启用 JavaScript。原始资料仍可从 <a href="https://cs229.stanford.edu/">官方课程站</a> 获取。</p><a href="sources.json">下载资料索引</a><ul><li><a href="#lesson-01">数学复习：线性代数与概率论</a></li><li><a href="#lesson-02">线性回归：LMS、正规方程与概率解释</a></li><li><a href="#lesson-03">分类与逻辑回归：sigmoid、最大似然与牛顿法</a></li><li><a href="#lesson-04">广义线性模型：指数族与 softmax 回归</a></li><li><a href="#lesson-05">生成式学习算法：GDA 与朴素贝叶斯</a></li><li><a href="#lesson-06">核方法：特征映射与核技巧</a></li><li><a href="#lesson-07">支持向量机：间隔、拉格朗日对偶与 SMO</a></li><li><a href="#lesson-08">深度学习：神经网络、向量化与反向传播</a></li><li><a href="#lesson-09">决策树与集成：bagging、随机森林与 boosting</a></li><li><a href="#lesson-10">偏差、方差与模型选择：交叉验证、特征选择与贝叶斯正则化</a></li><li><a href="#lesson-11">学习理论：一致收敛、样本复杂度与 VC 维</a></li><li><a href="#lesson-12">在线学习与感知机的犯错次数上界</a></li><li><a href="#lesson-13">k-means 聚类：失真函数与坐标下降</a></li><li><a href="#lesson-14">高斯混合与 EM 算法</a></li><li><a href="#lesson-15">因子分析：n ≫ m 时的低维潜变量模型</a></li><li><a href="#lesson-16">主成分分析（PCA）：投影方差最大的方向</a></li><li><a href="#lesson-17">独立成分分析（ICA）：鸡尾酒会问题</a></li><li><a href="#lesson-18">马尔可夫决策过程：Bellman 方程、价值迭代与策略迭代</a></li><li><a href="#lesson-19">学习 MDP 模型与连续状态：离散化与拟合价值迭代</a></li><li><a href="#lesson-20">隐马尔可夫模型：前向算法、Viterbi 与 Baum-Welch</a></li><li><a href="#lesson-21">多元高斯与高斯过程回归</a></li><li><a href="#lesson-22">应用机器学习的建议，以及隐私与差分隐私</a></li></ul></main></noscript>
