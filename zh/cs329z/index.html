<div id="course-app"></div><noscript><main><h1>AI 智能体工程</h1><p>19 讲中文导学，按 CS329Z 官方讲义的顺序整理智能体系统的构件（LLM、RAG、工具调用、框架）、设计（设计模式、记忆、多智能体、优化）、数据与评测，以及课表上的后续专题。第 01–13 讲每段注明讲义页码；第 14–19 讲的讲义尚未公开，只提供依据课表和阅读材料的听课提纲。代码演示和手算例题只在讲义或作业需要时提供。</p><p>交互学习需要启用 JavaScript。原始资料仍可从 <a href="https://cs329z.stanford.edu/">官方课程站</a> 获取。</p><a href="sources.json">下载资料索引</a><ul><li><a href="#lesson-01">什么是智能体系统：历史、解剖结构与关键挑战</a></li><li><a href="#lesson-02">面向构建者的 LLM：架构、训练、推理与上下文工程</a></li><li><a href="#lesson-03">检索增强生成：索引、检索器、智能体式 RAG 与失败模式</a></li><li><a href="#lesson-04">工具使用与函数调用：从 Toolformer 到 MCP 与 τ-bench</a></li><li><a href="#lesson-05">框架与编排：DSPy、LangGraph、智能体 harness 与 Temporal</a></li><li><a href="#lesson-06">智能体设计模式：工作流模式、推理—行动模式与上下文管理</a></li><li><a href="#lesson-07">智能体记忆架构：记忆类型、四种架构模式与记忆评测</a></li><li><a href="#lesson-08">多智能体系统：编排、通信、协调与失败模式</a></li><li><a href="#lesson-09">优化：上下文优化、权重优化与用智能体做优化</a></li><li><a href="#lesson-10">嘉宾讲座：Terminal-Bench 与 Harbor——用评测驱动智能体开发</a></li><li><a href="#lesson-11">智能体需要什么数据：轨迹、环境、数据来源与意外学到的东西</a></li><li><a href="#lesson-12">数据选择与质量：选哪些任务、模仿哪些轨迹、要更多还是更好</a></li><li><a href="#lesson-13">评测基础与基准设计：任务形式、评测协议、好基准与可信分数</a></li><li><a href="#lesson-14">Andrew Ng 对谈：带着问题听课</a></li><li><a href="#lesson-15">LLM 裁判与评测基础设施（预习提纲）</a></li><li><a href="#lesson-16">嘉宾讲座：SWE-bench 与编码评测的演进（预习提纲）</a></li><li><a href="#lesson-17">智能体安全与护栏（预习提纲）</a></li><li><a href="#lesson-18">编码与软件智能体（预习提纲）</a></li><li><a href="#lesson-19">主动智能体：何时主动、何时等待（预习提纲）</a></li></ul></main></noscript>
