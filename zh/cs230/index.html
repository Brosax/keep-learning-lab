<div id="course-app"></div><noscript><main><h1>深度学习：从神经网络到完整项目</h1><p>18 讲中文导学。第 01–13 讲按 CS230 课表公开的在线模块幻灯片（DeepLearning.AI 深度学习专项课程 C1–C5）、助教课讲义和官方项目代码整理，每段注明页码或文件；第 14–18 讲的课堂讲授只有 2018 年公开视频，写成看视频的提纲和背景知识。交互图示和代码演示只在讲义内容需要时提供。</p><p>交互学习需要启用 JavaScript。原始资料仍可从 <a href="https://cs230.stanford.edu/">官方课程站</a> 获取。</p><a href="sources.json">下载资料索引</a><ul><li><a href="#lesson-01">深度学习导论与项目起步</a></li><li><a href="#lesson-02">神经网络表示：逻辑回归、向量化与前向传播</a></li><li><a href="#lesson-03">梯度下降、反向传播与梯度检查</a></li><li><a href="#lesson-04">优化算法与超参数调优</a></li><li><a href="#lesson-05">正则化、初始化与 Batch Norm</a></li><li><a href="#lesson-06">数据划分与偏差—方差诊断</a></li><li><a href="#lesson-07">用 PyTorch 搭建训练闭环：读懂官方项目代码</a></li><li><a href="#lesson-08">误差分析：可避免偏差、错误分类与数据不匹配</a></li><li><a href="#lesson-09">设定目标：单一评价指标、满足指标与何时修改指标</a></li><li><a href="#lesson-10">卷积网络：从边缘检测到目标检测、人脸识别与风格迁移</a></li><li><a href="#lesson-11">序列模型：RNN、GRU、LSTM 与词嵌入</a></li><li><a href="#lesson-12">序列到序列、注意力机制与 Transformer</a></li><li><a href="#lesson-13">迁移学习、多任务学习与端到端学习</a></li><li><a href="#lesson-14">生成对抗网络与对抗样本</a></li><li><a href="#lesson-15">可解释性：网络学到了什么</a></li><li><a href="#lesson-16">AI 与医疗：任务定义、数据划分与外部验证</a></li><li><a href="#lesson-17">深度强化学习：从标签到回报</a></li><li><a href="#lesson-18">完成课程项目：文献、提案、报告与展示</a></li></ul></main></noscript>
